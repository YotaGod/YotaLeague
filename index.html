<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagan eFootball</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase SDK via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>🏆 Bagan eFootball</h1>
    <button id="btn-reset-all" class="danger">🗑️ Hapus Semua Data</button>
  </header>

  <main>
    <!-- Setup Awal -->
    <section id="setup-section">
    <h2>Setup Turnamen Baru</h2>
    <form id="setup-form">
        <input type="text" id="tournament-name" placeholder="Nama Turnamen" required>
        
        <!-- Pemilih Mode Turnamen -->
        <div class="mode-selector">
        <label>Pilih Sistem Turnamen:</label>
        <div class="mode-options">
            <label class="mode-card">
            <input type="radio" name="tournament-mode" value="single" checked>
            <div class="mode-content">
                <span class="mode-icon">🏆</span>
                <strong>Single Elimination</strong>
                <small>Kalah langsung gugur. Jumlah pemain harus genap.</small>
            </div>
            </label>
            
            <label class="mode-card">
            <input type="radio" name="tournament-mode" value="double">
            <div class="mode-content">
                <span class="mode-icon">🥊</span>
                <strong>Double Elimination</strong>
                <small>Kalah pindah ke Lower Bracket. Harus 4 atau 8 pemain.</small>
            </div>
            </label>
            
            <label class="mode-card">
            <input type="radio" name="tournament-mode" value="round_robin">
            <div class="mode-content">
                <span class="mode-icon">🔄</span>
                <strong>Round Robin</strong>
                <small>Semua bertemu semua. Single/Double.</small>
            </div>
            </label>
        </div>
        </div>
        
        <!-- Opsi tambahan untuk Round Robin -->
        <div id="round-robin-options" class="hidden">
        <label>Jenis Round Robin:</label>
        <div class="radio-group">
            <label><input type="radio" name="rr-type" value="single" checked> Single (1x bertemu)</label>
            <label><input type="radio" name="rr-type" value="double"> Double (2x bertemu)</label>
        </div>
        </div>
        
        <!-- ✅ TOMBOL CLUB ROULETTE -->
      <div class="roulette-trigger">
        <button type="button" id="btn-roulette" class="roulette-btn">
          🎰 Club Roulette
        </button>
        <small class="roulette-hint">Acak tim secara fun dengan deteksi wajah!</small>
      </div>

      <!-- Modal Pilih Kategori -->
      <div id="roulette-category-modal" class="modal hidden">
        <div class="modal-content roulette-modal">
          <h3> Pilih Kategori</h3>
          <div class="category-options">
            <button type="button" class="category-btn" data-category="Premier League">
              <span class="cat-icon">🇬🇧</span>
              <span>Premier League</span>
            </button>
            <button type="button" class="category-btn" data-category="La Liga">
              <span class="cat-icon">🇪🇸</span>
              <span>La Liga</span>
            </button>
            <button type="button" class="category-btn" data-category="Serie A">
              <span class="cat-icon">🇮🇹</span>
              <span>Serie A</span>
            </button>
            <button type="button" class="category-btn" data-category="Nation">
              <span class="cat-icon">🌍</span>
              <span>Nation</span>
            </button>
            <button type="button" class="category-btn" data-category="All">
              <span class="cat-icon">🌐</span>
              <span>All</span>
            </button>
          </div>
          <button type="button" id="close-category-modal" class="secondary" style="margin-top: 15px;">Batal</button>
        </div>
      </div>

      <!-- Modal Kamera & Roulette -->
      <div id="roulette-camera-modal" class="modal hidden">
        <div class="modal-content roulette-camera-modal">
          <div class="camera-container">
            <video id="roulette-video" autoplay playsinline></video>
            <div id="face-indicator" class="face-indicator hidden">👤 Wajah Terdeteksi!</div>
            <div id="no-face-warning" class="no-face-warning hidden">
              ️ Tidak ada wajah terdeteksi. Pastikan kamera aktif dan wajah Anda terlihat.
            </div>
          </div>
          <div id="roulette-display" class="roulette-display">
            <div id="roulette-spinner" class="roulette-spinner hidden">
              <div id="spinner-logo" class="spinner-logo"></div>
              <div id="spinner-name" class="spinner-name">...</div>
            </div>
            <div id="roulette-result" class="roulette-result hidden">
              <div class="result-label">🎉 Klub Terpilih!</div>
              <div id="result-logo" class="result-logo"></div>
              <div id="result-name" class="result-name"></div>
              <div id="result-category" class="result-category"></div>
            </div>
            <div id="roulette-status" class="roulette-status">Memilih kategori...</div>
          </div>
          <button type="button" id="close-camera-modal" class="danger" style="margin-top: 15px;">Tutup</button>
        </div>
      </div>

        <input type="number" id="player-count" placeholder="Jumlah Pemain" min="2" required>
        <div id="players-inputs"></div>
        <button type="submit">Buat & Mulai</button>
    </form>
    </section>

    <!-- Area Bagan -->
    <section id="bracket-section" class="hidden">
    <div class="bracket-header">
        <h2 id="bracket-title"></h2>
        <div class="bracket-actions">
        <button id="btn-kembali" class="secondary">← Kembali</button>
        </div>
    </div>
    <div id="bracket-container"></div>
    <div id="log-container">
        <h3>📜 Log Aktivitas</h3>
        <ul id="log-list"></ul>
    </div>
    </section>
  </main>

  <!-- Modal Input Skor -->
  <div id="score-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Input Skor</h3>
      <p id="match-info"></p>
      <div class="score-inputs">
        <input type="number" id="score-a" placeholder="Skor Tim A" min="0">
        <span>-</span>
        <input type="number" id="score-b" placeholder="Skor Tim B" min="0">
      </div>
      <button id="confirm-score">Simpan</button>
      <button id="close-modal" class="secondary">Batal</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
