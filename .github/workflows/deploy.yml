name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Izin untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Supabase credentials ke config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Buat config.local.js dari GitHub Secrets — file ini tidak ada di repo
          cat > config.local.js << EOF
          window.__APP_CONFIG__ = {
            supabaseUrl: "${SUPABASE_URL}",
            supabaseAnonKey: "${SUPABASE_ANON_KEY}"
          };
          EOF
          echo "✅ config.local.js berhasil dibuat dari GitHub Secrets"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact ke GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload seluruh folder (termasuk config.local.js yang baru dibuat)
          path: "."

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
