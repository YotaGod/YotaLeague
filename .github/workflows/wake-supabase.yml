name: Wake Up Supabase

on:
  schedule:
    - cron: "0 6 * * *"   # Runs once per day at 06:00 UTC (13:00 WIB)
  workflow_dispatch:       # Allows manual runs from the Actions tab

jobs:
  ping-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SUPABASE_PROJECTS_JSON secret exists
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECTS_JSON }}" ]; then
            echo "❌ Secret SUPABASE_PROJECTS_JSON is not set."
            echo "Go to Settings → Secrets and variables → Actions and add it."
            exit 1
          fi

      - name: Query Supabase database to keep projects awake
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          # Install jq for JSON parsing
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y jq > /dev/null

          LENGTH=$(echo "$SUPABASE_PROJECTS_JSON" | jq '. | length')
          echo "📦 Found $LENGTH Supabase project(s)."

          if [ "$LENGTH" -eq 0 ]; then
            echo "⚠️ No projects defined in SUPABASE_PROJECTS_JSON."
            exit 0
          fi

          for i in $(seq 0 $((LENGTH - 1))); do
            URL=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].url")
            KEY=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].anon_key")

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "⚠️ Skipping project at index $i — missing url."
              continue
            fi

            if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
              echo "⚠️ Skipping $URL — missing anon_key."
              continue
            fi

            # ✅ Insert data ke log_activity — ini pasti dihitung sebagai aktivitas tulis oleh Supabase
            DB_URL="${URL%/}/rest/v1/log_activity"
            echo "🗄️  Inserting wakeup log to: $DB_URL"

            # Allow curl to fail without killing the whole job
            set +e
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"tournaments_nama": "SYSTEM_WAKEUP", "deskripsi": "Automated ping to keep project alive"}' \
              "$DB_URL")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "❌ Curl failed for $URL (exit code $CURL_EXIT). Skipping."
              continue
            fi

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ $URL — Insert responded HTTP $HTTP_CODE — project is ALIVE!"
            elif [ "$HTTP_CODE" -eq 404 ]; then
              echo "⚠️ $URL — HTTP 404 (tabel mungkin belum ada, tapi DB sudah aktif)"
            else
              echo "❌ $URL — HTTP $HTTP_CODE — check project status or URL."
            fi

            # Tambahan: ping auth health juga sebagai backup
            HEALTH_URL="${URL%/}/auth/v1/health"
            curl -s -o /dev/null -H "apikey: $KEY" "$HEALTH_URL" || true
            echo "🔔 Auth health also pinged for $URL"
          done
